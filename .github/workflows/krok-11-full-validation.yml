name: Krok 11 - Full local and integration validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/krok-11-full-validation.yml'
      - 'codei/app/**'
      - 'codei/tests/**'
      - 'codei/composer.json'
      - 'codei/composer.lock'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/krok-11-full-validation.yml'
      - 'codei/app/**'
      - 'codei/tests/**'
      - 'codei/composer.json'
      - 'codei/composer.lock'

permissions:
  contents: read

jobs:
  validate-krok-11:
    name: Validate all nine Krok 11 blocks
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: metodika_krok11
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      CI_ENVIRONMENT: development
      app_baseURL: http://127.0.0.1:8091/
      database_default_hostname: 127.0.0.1
      database_default_port: 3306
      database_default_database: metodika_krok11
      database_default_username: root
      database_default_password: root
      database_default_DBDriver: MySQLi
      database_default_DBDebug: 'false'
      database_default_charset: utf8mb4
      database_default_DBCollat: utf8mb4_bin
      METODIKA_DIAGNOSTICS_ENABLED: '1'
      METODIKA_CONCURRENCY_WEB_ENABLED: '1'
      METODIKA_DIAGNOSTICS_TOKEN: krok11-secret-token
      KROK11_BASE_URL: http://127.0.0.1:8091
      KROK11_HOST: 127.0.0.1
      KROK11_PORT: '8091'

    steps:
      - name: Checkout exact validation SHA
        uses: actions/checkout@v4

      - name: Setup PHP 8.4, extensions and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, mysqli, pcntl, curl, xml, dom
          tools: composer:v2
          coverage: none
        env:
          fail-fast: true

      - name: Verify runtime and install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mariadb-client
          php --version
          composer --version
          php -m | grep -E '^(curl|dom|intl|mbstring|mysqli|pcntl|xml)$'
          php -r 'if (!defined("MYSQLI_ASYNC")) { fwrite(STDERR, "MYSQLI_ASYNC missing\n"); exit(1); } echo "MYSQLI_ASYNC=true\n";'

      - name: Install locked dependencies
        working-directory: codei
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configure isolated development environment
        working-directory: codei
        run: |
          cat > .env <<'ENV'
          CI_ENVIRONMENT = development
          app.baseURL = 'http://127.0.0.1:8091/'
          app.forceGlobalSecureRequests = false
          database.default.hostname = 127.0.0.1
          database.default.database = metodika_krok11
          database.default.username = root
          database.default.password = root
          database.default.DBDriver = MySQLi
          database.default.DBPrefix =
          database.default.port = 3306
          database.default.charset = utf8mb4
          database.default.DBCollat = utf8mb4_bin
          database.default.DBDebug = false
          METODIKA_DIAGNOSTICS_ENABLED = 1
          METODIKA_CONCURRENCY_WEB_ENABLED = 1
          METODIKA_DIAGNOSTICS_TOKEN = krok11-secret-token
          ENV

      - name: Verify syntax and exact diff hygiene
        run: |
          php -l codei/tests/session/DiagnosticsAuthenticationFlowTest.php
          php -l codei/tests/session/DiagnosticsProjectionCompatibilityTest.php
          bash -n codei/tests/integration/krok11-http-e2e.sh
          git diff --check origin/main...HEAD

      - name: Verify isolated MariaDB and empty initial state
        run: |
          test "$(mariadb -h 127.0.0.1 -uroot -proot -Nse 'SELECT DATABASE()' metodika_krok11)" = "metodika_krok11"
          mariadb -h 127.0.0.1 -uroot -proot -Nse "SELECT ENGINE, SUPPORT FROM information_schema.ENGINES WHERE ENGINE='InnoDB'" | grep -E '^InnoDB[[:space:]]+(DEFAULT|YES)$'

      - name: Run migrations M1-M8 and verify schema
        working-directory: codei
        run: |
          php spark migrate --all
          php spark migrate:status
          php spark metodika:verify-question-schema

      - name: Record database counts before validation
        run: |
          for table in \
            question_derivation_request_reservations \
            question_derivation_runs \
            question_derivation_run_domain_terms \
            question_derivation_run_results; do
            count="$(mariadb -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM ${table}" metodika_krok11)"
            echo "BEFORE_${table}=${count}"
            test "${count}" = "0"
          done

      - name: Block 1-3 and shared contracts - run all unit tests
        working-directory: codei
        run: vendor/bin/phpunit --no-coverage tests/unit

      - name: Blocks 3-4 and 8-9 - run complete current session coverage
        working-directory: codei
        run: |
          find tests/session -maxdepth 1 -type f -name '*Test.php' \
            ! -name 'DiagnosticsControllerTest.php' \
            ! -name 'DiagnosticsAuthenticationFlowTest.php' \
            ! -name 'DiagnosticsProjectionCompatibilityTest.php' \
            -print0 \
            | xargs -0 -r vendor/bin/phpunit --no-coverage

          vendor/bin/phpunit --no-coverage tests/session/DiagnosticsControllerTest.php \
            --filter '/^(?!.*(?:testDiagnosticsPageShowsConcurrencyUiWhenFeatureFlagEnabled|testConcurrencyHitFlowOpensBarrierWhenPartnerIsAlreadyReady|testConcurrencyHitAcceptFailureStoresSafeErrorCode)).*$/'

          vendor/bin/phpunit --no-coverage tests/session/DiagnosticsAuthenticationFlowTest.php
          vendor/bin/phpunit --no-coverage tests/session/DiagnosticsProjectionCompatibilityTest.php

      - name: Block 1 and 6 - run true two-process file-store test
        working-directory: codei
        run: vendor/bin/phpunit --no-coverage tests/integration/DiagnosticsConcurrencyBarrierProcessTest.php

      - name: Block 5 - verify integration transaction rollback
        working-directory: codei
        run: php spark metodika:verify-first-acceptance-transaction

      - name: Block 6 - verify true concurrent first acceptance
        working-directory: codei
        run: php spark metodika:verify-concurrent-first-acceptance

      - name: Block 2 and shared success criterion - verify exact reservation regression
        working-directory: codei
        env:
          METODIKA_ROOT_CAUSE_REPRO_ENABLED: '1'
        run: |
          output="$(php spark metodika:reproduce-first-acceptance-root-cause 2>&1)"
          printf '%s\n' "${output}"
          grep -F 'FIRST_ACCEPTANCE_REGRESSION_CONFIRMED' <<< "${output}"
          grep -F 'FIRST_OUTCOME=RESERVATION_CREATED' <<< "${output}"
          grep -F 'SECOND_OUTCOME=ALREADY_EXISTS' <<< "${output}"
          grep -F 'NO_DUPLICATE_INITIAL_HISTORY_RUN=true' <<< "${output}"
          grep -F 'SECOND_PARTICIPANT_LEFT_NO_ROWS=true' <<< "${output}"
          grep -F 'CLEANUP_CONFIRMED' <<< "${output}"

      - name: Blocks 4, 7, 8 and 9 - run real HTTP START-HIT-RESULT flow
        working-directory: codei
        run: |
          chmod +x tests/integration/krok11-http-e2e.sh
          output="$(tests/integration/krok11-http-e2e.sh 2>&1)"
          printf '%s\n' "${output}"
          grep -F 'KROK11_HTTP_E2E_CONFIRMED' <<< "${output}"
          grep -F 'DB_UNIQUENESS=true' <<< "${output}"
          grep -F 'OUTCOMES=CREATED+ALREADY_EXISTS' <<< "${output}"
          grep -F 'CLEANUP=true' <<< "${output}"
          grep -F 'STATE=COMPLETED_SUCCESS' <<< "${output}"
          grep -F 'TOMBSTONE=true' <<< "${output}"
          grep -F 'SWEEP=true' <<< "${output}"
          grep -F 'LOGIN_DATABASE_LOGOUT=true' <<< "${output}"

      - name: Verify final database and run-store cleanup
        working-directory: codei
        run: |
          for table in \
            question_derivation_request_reservations \
            question_derivation_runs \
            question_derivation_run_domain_terms \
            question_derivation_run_results; do
            count="$(mariadb -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM ${table}" metodika_krok11)"
            echo "AFTER_${table}=${count}"
            test "${count}" = "0"
          done
          test -z "$(find writable/diagnostics/concurrency -maxdepth 1 -type f \( -name '*.json' -o -name '*.lock' -o -name '*.tmp.*' \) -print -quit 2>/dev/null)"
          test -z "$(find writable/tests -type f \( -name '*.json' -o -name '*.lock' -o -name '*.tmp.*' \) -print -quit 2>/dev/null)"
          echo 'KROK11_FINAL_CLEANUP_CONFIRMED'

      - name: Preserve validation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: krok11-validation-diagnostics
          path: |
            codei/build/logs
            codei/writable/logs
            codei/writable/diagnostics
            codei/writable/tests
          if-no-files-found: ignore
          retention-days: 2
