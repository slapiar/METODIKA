name: Archivácia INI 2026-07-24

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/archive-ini-2026-07-24.yml

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and verify archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find postupy/WORK/INI -maxdepth 1 -type f -name '2026-07-24_*_INI_*.md' -print | sort)

          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 8

          mkdir -p postupy/WORK/INI/ARCHIV
          archive='postupy/WORK/INI/ARCHIV/2026-07-24_INI.zip'
          rm -f "$archive"
          zip -j -9 "$archive" "${files[@]}"

          mapfile -t expected < <(printf '%s\n' "${files[@]##*/}" | sort)
          mapfile -t actual < <(unzip -Z1 "$archive" | sort)
          test "${#actual[@]}" -eq 8
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          unzip -t "$archive"

          sha256sum "$archive" | tee postupy/WORK/INI/ARCHIV/2026-07-24_INI.zip.sha256
          rm -f "${files[@]}"

      - name: Update register and changelog
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          archive = Path('postupy/WORK/INI/ARCHIV/2026-07-24_INI.zip')
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()

          readme_path = Path('postupy/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          lines = [line for line in readme.splitlines() if 'WORK/INI/2026-07-24_' not in line]
          row = f'| `WORK/INI/ARCHIV/2026-07-24_INI.zip` | ARCHÍV — DO DOKONČENIA PLÁNU | Osem pracovných INI záznamov z 2026-07-24; SHA-256 `{digest}`. Po dokončení plánu sa archív odstráni. |'
          header = '|---|---|---|'
          idx = lines.index(header)
          if row not in lines:
              lines.insert(idx + 1, row)
          readme_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          marker = '## 2026-07-25\n\n'
          entry = (
              '### Archivácia pracovných INI záznamov z 2026-07-24\n\n'
              '- osem jednotlivých pracovných INI bolo zabalených do '
              '`postupy/WORK/INI/ARCHIV/2026-07-24_INI.zip`,\n'
              f'- SHA-256 archívu: `{digest}`,\n'
              '- obsah ZIP-u bol overený podľa úplného zoznamu a testom integrity,\n'
              '- jednotlivé originály boli po overení odstránené; archív zostáva iba do dokončenia aktuálneho plánu.\n\n'
          )
          if entry not in changelog:
              if marker not in changelog:
                  raise SystemExit('Chýba sekcia CHANGELOG pre 2026-07-25')
              changelog = changelog.replace(marker, marker + entry, 1)
          changelog_path.write_text(changelog, encoding='utf-8')

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/archive-ini-2026-07-24.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Archivácia pracovných INI záznamov z 2026-07-24'
          git push origin HEAD:main
