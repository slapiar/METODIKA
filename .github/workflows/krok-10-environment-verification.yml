# Overovací trigger Kroku 10 — 2026-07-25
name: Krok 10 - overenie prostredia

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/krok-10-environment-verification.yml'

permissions:
  contents: read

jobs:
  verify-environment:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: metodika_krok10
          MARIADB_USER: metodika
          MARIADB_PASSWORD: metodika
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: codei

    env:
      CI_ENVIRONMENT: development
      database_default_hostname: 127.0.0.1
      database_default_port: 3306
      database_default_database: metodika_krok10
      database_default_username: metodika
      database_default_password: metodika
      database_default_DBDriver: MySQLi
      database_default_DBDebug: 'false'
      database_default_charset: utf8mb4
      database_default_DBCollat: utf8mb4_bin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, mysqli
          tools: composer:v2
          coverage: none

      - name: Verify runtime
        run: |
          php --version
          composer --version
          php -m | grep -E '^(intl|mbstring|mysqli)$'

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify isolated MariaDB
        run: |
          php -r '$db = new mysqli("127.0.0.1", "metodika", "metodika", "metodika_krok10", 3306); if ($db->connect_errno) { fwrite(STDERR, $db->connect_error . PHP_EOL); exit(1); } $row = $db->query("SELECT DATABASE() db, VERSION() version, @@default_storage_engine engine")->fetch_assoc(); echo json_encode($row, JSON_PRETTY_PRINT) . PHP_EOL; if ($row["db"] !== "metodika_krok10" || strtoupper($row["engine"]) !== "INNODB") exit(2);'

      - name: Run migrations M1-M8
        run: php spark migrate --all

      - name: Verify schema and empty initial state
        run: |
          php -r '$db = new mysqli("127.0.0.1", "metodika", "metodika", "metodika_krok10", 3306); $tables = ["question_derivation_request_reservations", "question_derivation_runs", "question_derivation_run_results"]; foreach ($tables as $table) { $result = $db->query("SELECT COUNT(*) c FROM `{$table}`"); if (!$result) { fwrite(STDERR, $db->error . PHP_EOL); exit(1); } $count = (int) $result->fetch_assoc()["c"]; echo $table . "=" . $count . PHP_EOL; if ($count !== 0) exit(2); }'

      - name: Verify two independent connections and rollback
        run: |
          php -r '$a = new mysqli("127.0.0.1", "metodika", "metodika", "metodika_krok10", 3306); $b = new mysqli("127.0.0.1", "metodika", "metodika", "metodika_krok10", 3306); $idA = (int) $a->query("SELECT CONNECTION_ID() id")->fetch_assoc()["id"]; $idB = (int) $b->query("SELECT CONNECTION_ID() id")->fetch_assoc()["id"]; echo "connection_a={$idA}\nconnection_b={$idB}\n"; if ($idA === $idB) exit(1); $a->begin_transaction(); $a->query("INSERT INTO question_derivation_request_reservations (request_reference,payload_fingerprint,derivation_reference,reservation_state,reserved_at,updated_at) VALUES (\"krok10-env-check\", REPEAT(\"a\",64), \"krok10-env-derivation\", \"RESERVED\", NOW(6), NOW(6))"); if ($a->affected_rows !== 1) exit(2); $a->rollback(); $count = (int) $b->query("SELECT COUNT(*) c FROM question_derivation_request_reservations WHERE request_reference=\"krok10-env-check\"")->fetch_assoc()["c"]; echo "rollback_count={$count}\n"; if ($count !== 0) exit(3);'

      - name: Final cleanup verification
        run: |
          php -r '$db = new mysqli("127.0.0.1", "metodika", "metodika", "metodika_krok10", 3306); $count = (int) $db->query("SELECT COUNT(*) c FROM question_derivation_request_reservations WHERE request_reference LIKE \"krok10-env-%\"")->fetch_assoc()["c"]; echo "cleanup_count={$count}\n"; if ($count !== 0) exit(1);'
