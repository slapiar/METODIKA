name: Krok 10 - First acceptance regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/krok-7-root-cause-reproduction.yml'
      - 'codei/app/Infrastructure/Persistence/QuestionDerivation/RequestReferenceRepository.php'
      - 'codei/app/Commands/ReproduceFirstAcceptanceRootCause.php'
      - 'codei/tests/unit/FirstAcceptanceServiceTest.php'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/krok-7-root-cause-reproduction.yml'
      - 'codei/app/Infrastructure/Persistence/QuestionDerivation/RequestReferenceRepository.php'
      - 'codei/app/Commands/ReproduceFirstAcceptanceRootCause.php'
      - 'codei/tests/unit/FirstAcceptanceServiceTest.php'

permissions:
  contents: read

jobs:
  verify-first-acceptance:
    name: Verify exact reservation on isolated MariaDB
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: metodika_krok10
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4, extensions and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, intl, mbstring, xml, curl
          tools: composer:v2
          coverage: none
        env:
          fail-fast: true

      - name: Verify runtime and install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mariadb-client
          php -v
          php -m | grep -E '^(intl|mysqli)$'
          composer --version

      - name: Install locked dependencies
        working-directory: codei
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify PHP syntax
        run: |
          php -l codei/app/Infrastructure/Persistence/QuestionDerivation/RequestReferenceRepository.php
          php -l codei/app/Commands/ReproduceFirstAcceptanceRootCause.php

      - name: Run focused unit tests
        working-directory: codei
        run: |
          set +e
          vendor/bin/phpunit --no-coverage tests/unit/FirstAcceptanceServiceTest.php > phpunit-krok10.log 2>&1
          status=$?
          cat phpunit-krok10.log
          exit "$status"

      - name: Preserve PHPUnit failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: krok10-phpunit-output
          path: codei/phpunit-krok10.log
          if-no-files-found: error
          retention-days: 1

      - name: Configure isolated development database
        working-directory: codei
        run: |
          cat > .env <<'ENV'
          CI_ENVIRONMENT=development
          database.default.hostname=127.0.0.1
          database.default.database=metodika_krok10
          database.default.username=root
          database.default.password=root
          database.default.DBDriver=MySQLi
          database.default.DBPrefix=
          database.default.port=3306
          database.default.charset=utf8mb4
          database.default.DBCollat=utf8mb4_bin
          database.default.DBDebug=false
          ENV

      - name: Verify isolated MariaDB target
        run: |
          test "$(mariadb -h 127.0.0.1 -uroot -proot -Nse 'SELECT DATABASE()' metodika_krok10)" = "metodika_krok10"
          mariadb -h 127.0.0.1 -uroot -proot -Nse "SELECT ENGINE, SUPPORT FROM information_schema.ENGINES WHERE ENGINE='InnoDB'" | grep -E '^InnoDB[[:space:]]+(DEFAULT|YES)$'

      - name: Run migrations M1-M8
        working-directory: codei
        run: |
          php spark migrate --all
          php spark migrate:status

      - name: Verify question derivation schema
        working-directory: codei
        run: php spark metodika:verify-question-schema

      - name: Verify first acceptance regression
        working-directory: codei
        env:
          METODIKA_ROOT_CAUSE_REPRO_ENABLED: '1'
        run: |
          output="$(php spark metodika:reproduce-first-acceptance-root-cause 2>&1)"
          printf '%s\n' "$output"
          grep -F 'FIRST_ACCEPTANCE_REGRESSION_CONFIRMED' <<< "$output"
          grep -F 'FIRST_OUTCOME=RESERVATION_CREATED' <<< "$output"
          grep -F 'SECOND_OUTCOME=ALREADY_EXISTS' <<< "$output"
          grep -F 'NO_DUPLICATE_INITIAL_HISTORY_RUN=true' <<< "$output"
          grep -F 'SECOND_PARTICIPANT_LEFT_NO_ROWS=true' <<< "$output"
          grep -F 'CLEANUP_CONFIRMED' <<< "$output"
