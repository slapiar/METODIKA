name: Refactor methodology v2 evidence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refactor-methodology-v2-evidence.yml

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and write evidence
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          methodology_path = Path('postupy/Inicializácia práce.md')
          methodology = methodology_path.read_text(encoding='utf-8')

          required = [
              '# METODIKA: Inicializačný a vykonávací protokol (v2.0)',
              '## 1. INICIALIZAČNÁ BRÁNA (Gatekeeper)',
              '## 2. PRAVIDLÁ INICIALIZÁCIE (GATE Logic)',
              '## 3. FYZICKÝ PRACOVNÝ POSTUP (Po GATE=OPEN)',
              '## 4. PROTOKOL PRI PORUŠENÍ (STOP Protocol)',
              'STOP: PORUŠENIE BEZPEČNOSTNEJ BRÁNY',
          ]
          missing = [item for item in required if item not in methodology]
          if missing:
              raise SystemExit(f'Chýbajú povinné časti metodiky: {missing}')
          if methodology.count('```') != 6:
              raise SystemExit('Neplatný počet ohraničení code blokov v metodike.')
          if not methodology.endswith('```\n'):
              raise SystemExit('Metodika nekončí uzavretým STOP code blokom.')

          work_path = Path('postupy/WORK/2026-07-26_06-52_Refaktorizacia_inicializacnej_metodiky_v2.md')
          work_path.write_text('''# Refaktorizácia inicializačnej metodiky na v2.0

Dátum a čas: 2026-07-26 06:52 Europe/Bratislava

## Stav úkonu

```text
SPLNENÉ
```

## Zadanie

Nahradiť pôvodný rozsiahly dokument `postupy/Inicializácia práce.md` presne dodanou štandardizovanou verziou v2.0, vykonať vzdialený read-after-write a zosúladiť register a changelog.

## Inicializačná brána

- INI: `postupy/WORK/INI/2026-07-26_06-44_INI_refaktorizacia-inicializacnej-metodiky-v2.md`
- prvý INI commit: `907350a41435299d156a9e95bb3cd6deccfe87aa`
- commit otvorenia brány: `b8cb5b3d95fa520be93d1c8c49c76e60a57f2eda`
- výsledok: `GATE=OPEN`

## Vykonaná zmena

- pôvodný dokument: 432 riadkov, blob `1f32fd9144a4cc3ca94ca8219a1d5dcb4518ee19`,
- nový dokument: 94 riadkov, verzia v2.0,
- commit náhrady: `6e566cc0e6df6a2b9c0cfdaaa4fb7827d8a6b4df`,
- nový blob: `44729126508a0c9151fb2358badcb1445a425bd6`.

Obsah bol nahradený presne textom dodaným používateľom. Neboli pridané vlastné metodické pravidlá ani rozšírenia.

## Read-after-write a Validácia

Vzdialené spätné načítanie potvrdilo:

- správny súbor a vetvu `main`,
- titul verzie v2.0,
- štyri hlavné sekcie,
- deväťbodovú INI šablónu,
- GATE logiku,
- osemstupňový fyzický pracovný postup,
- tri správne uzavreté code bloky,
- úplný záverečný STOP protokol,
- ukončenie súboru uzatváracím ```.

## Evidencia

V tom istom pracovnom kroku boli aktualizované:

- `postupy/README.md`,
- `CHANGELOG.md`,
- tento WORK záznam,
- pôvodný INI záznam refaktorizácie.

## Hranice

Nezmenili sa `/codei`, testy, workflowy projektu po odstránení jednorazového evidenčného workflowu, migrácie, databáza, release verzia, ZIP balíky ani produkcia.

## Rollback

Obnoviť pôvodný blob `1f32fd9144a4cc3ca94ca8219a1d5dcb4518ee19` a novou historickou udalosťou zosúladiť register a changelog.

## Nasledujúci krok

Po uzavretí tejto refaktorizácie pokračovať podľa aktuálneho záväzného plánu od jeho prvého nevykonaného kroku.
''', encoding='utf-8')

          register_path = Path('postupy/README.md')
          register = register_path.read_text(encoding='utf-8')
          register_lines = register.splitlines()
          updated_lines = []
          replaced_methodology = False
          for line in register_lines:
              if line.startswith('| `Inicializácia práce.md` |'):
                  updated_lines.append('| `Inicializácia práce.md` | POTVRDENÝ-NA-PRENESENIE | Hlavný inicializačný predpis bol 2026-07-26 úplne refaktorovaný na štandardizovanú verziu v2.0. Pôvodný 432-riadkový text nahradila 94-riadková štruktúra GATE, fyzického pracovného postupu a STOP protokolu. Autoritatívnym obsahom je aktuálny súbor; pôvodný blob `1f32fd9...` zostáva rollback dôkazom. |')
                  replaced_methodology = True
              else:
                  updated_lines.append(line)
          if not replaced_methodology:
              raise SystemExit('V registri nebol nájdený riadok Inicializácia práce.md.')
          register = '\n'.join(updated_lines) + '\n'
          insertion = (
              '| `WORK/INI/2026-07-26_06-44_INI_refaktorizacia-inicializacnej-metodiky-v2.md` | PRACOVNÝ | Inicializačný dôkaz refaktorizácie metodiky na v2.0; deväť bodov bolo doložených a brána otvorená výlučne pre presnú náhradu súboru a povinnú evidenciu. |\n'
              '| `WORK/2026-07-26_06-52_Refaktorizacia_inicializacnej_metodiky_v2.md` | PRACOVNÝ | Záznam úplnej náhrady 432-riadkového predpisu štandardizovanou 94-riadkovou verziou v2.0, read-after-write, Validácie, rollbacku a evidencie. Výsledok `SPLNENÉ`. |\n'
          )
          header = '|---|---|---|\n'
          if 'WORK/INI/2026-07-26_06-44_INI_refaktorizacia-inicializacnej-metodiky-v2.md' not in register:
              register = register.replace(header, header + insertion, 1)
          register_path.write_text(register, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          entry = '''### Refaktorizácia inicializačnej metodiky na v2.0

- hlavný predpis [`postupy/Inicializácia práce.md`](postupy/Inicializácia%20práce.md) bol úplne nahradený používateľom dodanou štandardizovanou verziou v2.0,
- pôvodný rozsah 432 riadkov bol skrátený na 94 riadkov bez pridávania vlastných pravidiel; nový dokument obsahuje GATE šablónu, GATE logiku, fyzický pracovný postup a STOP protokol,
- inicializačný dôkaz je v [`postupy/WORK/INI/2026-07-26_06-44_INI_refaktorizacia-inicializacnej-metodiky-v2.md`](postupy/WORK/INI/2026-07-26_06-44_INI_refaktorizacia-inicializacnej-metodiky-v2.md),
- pracovný výsledok, read-after-write a rollback sú v [`postupy/WORK/2026-07-26_06-52_Refaktorizacia_inicializacnej_metodiky_v2.md`](postupy/WORK/2026-07-26_06-52_Refaktorizacia_inicializacnej_metodiky_v2.md),
- register [`postupy/README.md`](postupy/README.md) bol zosúladený; stav dokumentu zostáva `POTVRDENÝ-NA-PRENESENIE`,
- commit náhrady metodiky je `6e566cc0e6df6a2b9c0cfdaaa4fb7827d8a6b4df`, výsledný blob `44729126508a0c9151fb2358badcb1445a425bd6`,
- `/codei`, testy, migrácie, databáza, release verzia, balíky a produkcia sa týmto úkonom nemenili.

'''
          if '### Refaktorizácia inicializačnej metodiky na v2.0' not in changelog:
              marker = '## 2026-07-26\n\n'
              if marker not in changelog:
                  raise SystemExit('V changelogu nebol nájdený blok 2026-07-26.')
              changelog = changelog.replace(marker, marker + entry, 1)
          changelog_path.write_text(changelog, encoding='utf-8')

          ini_path = Path('postupy/WORK/INI/2026-07-26_06-44_INI_refaktorizacia-inicializacnej-metodiky-v2.md')
          ini = ini_path.read_text(encoding='utf-8')
          if '## Uzavretie úkonu podľa metodiky v2.0' not in ini:
              ini += '''

## Uzavretie úkonu podľa metodiky v2.0

```text
VÝSLEDOK=SPLNENÉ
METODIKA_COMMIT=6e566cc0e6df6a2b9c0cfdaaa4fb7827d8a6b4df
METODIKA_BLOB=44729126508a0c9151fb2358badcb1445a425bd6
READ_AFTER_WRITE=PASS
REGISTER=AKTUALIZOVANÝ
CHANGELOG=AKTUALIZOVANÝ
WORK=postupy/WORK/2026-07-26_06-52_Refaktorizacia_inicializacnej_metodiky_v2.md
OTVORENÉ_RIZIKÁ=ŽIADNE V ROZSAHU DOKUMENTAČNÉHO ÚKONU
NASLEDUJÚCI_KROK=návrat k aktuálnemu záväznému plánu
```

## Konečná matica plnenia pokynov

| ID pokynu | R (Prečítané) | W (Zapísané) |
|---|---|---|
| ID-01 až ID-14 | 1 | 1 |
'''
          ini_path.write_text(ini, encoding='utf-8')

          workflow = Path('.github/workflows/refactor-methodology-v2-evidence.yml')
          workflow.unlink()
          PY

      - name: Commit evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(methodology): zaevidovať refaktorizáciu v2.0"
          git push origin HEAD:main
